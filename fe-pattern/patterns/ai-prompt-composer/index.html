<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Prompt Composer — fe-pattern</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="composer-page">
    <div class="composer">
      <header class="composer-head">
        <div class="composer-title">
          <span class="composer-dot" aria-hidden="true"></span>
          <h1>Prompt Composer</h1>
        </div>
        <p class="composer-sub">Type a prompt. Press <kbd>Enter</kbd> to send, <kbd>Shift</kbd>+<kbd>Enter</kbd> for a newline.</p>
      </header>

      <div class="thread" id="thread" role="log" aria-live="polite">
        <div class="msg msg-assistant">
          <div class="avatar" aria-hidden="true">AI</div>
          <div class="bubble">Hi! Describe what you'd like to build and I'll help you shape it.</div>
        </div>
      </div>

      <form class="composer-box" id="composer-form">
        <div class="composer-input">
          <textarea
            id="prompt"
            class="prompt-textarea"
            rows="1"
            placeholder="Ask anything…"
            aria-label="Prompt"
          ></textarea>
        </div>
        <div class="composer-bar">
          <div class="composer-attaches">
            <button type="button" class="attach-btn" id="attach-file" title="Attach file" aria-label="Attach file">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M16.5 6v2H7.9a3.5 3.5 0 0 0 0 7h8.2a3.5 3.5 0 0 0 0-7H15a1.5 1.5 0 1 1 0-3h1.5Zm-3 8v2h-1.1a3.5 3.5 0 0 1 0-7H10v-2h2.5Zm3.5 5H7.9a5.5 5.5 0 0 1 0-11h1.1v2H7.9a3.5 3.5 0 0 0 0 7h8.2Z"/></svg>
            </button>
            <button type="button" class="attach-btn" id="attach-image" title="Attach image" aria-label="Attach image">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm0 2v6l5-5 4 4 3-3 4 4V6Zm-2 9a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm13-3a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/></svg>
            </button>
            <button type="button" class="attach-btn" id="attach-code" title="Add code snippet" aria-label="Add code snippet">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="m9.5 8-4.5 4 4.5 4 1.4-1.5L7 12.5l3.9-4Zm5 0L18.9 12l-4.5 4L13 16.5l3.9-4L13 8.5Z"/></svg>
            </button>
          </div>
          <div class="composer-right">
            <span class="counter" id="counter" aria-live="polite">0 / 2000</span>
            <button type="submit" class="send-btn" id="send-btn" aria-label="Send prompt">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 11l18-8-8 18-3-8Zm2 3v3h3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
              <span class="send-spinner" hidden></span>
            </button>
          </div>
        </div>
      </form>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
