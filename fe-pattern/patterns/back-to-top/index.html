<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Back to Top — demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="main" class="main">
    <h1>Back to top button</h1>
    <p class="demo-sub">Scroll down and a "Back to top" button appears. Tap/click it to smoothly
       return to the top. Works on PC and mobile.</p>

    <section class="content">
      <p>Scroll down to reveal the button. The button fades in once you've scrolled past a
         threshold, and smooth-scrolls the page back to the top when activated.</p>
      <div class="spacer"></div>
      <div class="spacer"></div>
      <div class="spacer"></div>
      <div class="spacer"></div>
      <div class="spacer"></div>
      <div class="spacer"></div>
    </section>
  </main>

  <button class="back-to-top" id="back-to-top" type="button" aria-label="Back to top" hidden>↑</button>

  <script src="app.js"></script>
</body>
</html>
