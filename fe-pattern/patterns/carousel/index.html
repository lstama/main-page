<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carousel — demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="demo">
    <h1>Accessible carousel</h1>
    <p class="demo-sub">WAI-ARIA carousel with keyboard, touch swipe, and autoplay.</p>

    <!--
      WAI-ARIA Carousel:
        - region with aria-roledescription="carousel"
        - each slide has aria-roledescription="slide" + aria-posinset/aria-setsize
        - prev/next buttons with aria-controls
        - indicator buttons in a role="group"; active one has aria-current
      Inactive slides are aria-hidden so screen readers only announce the current one.
    -->
    <section class="carousel" id="demo-carousel" aria-roledescription="carousel" aria-label="Featured gallery">
      <ul class="carousel-track">
        <li class="carousel-slide">
          <img
            src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%221600%22%20height%3D%22900%22%20viewBox%3D%220%200%201600%20900%22%3E%3Crect%20width%3D%221600%22%20height%3D%22900%22%20fill%3D%22%234f46e5%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20font-family%3D%22system-ui%22%20font-weight%3D%22600%22%20font-size%3D%2272%22%20fill%3D%22%23ffffff%22%3EMountain%20View%3C%2Ftext%3E%3C%2Fsvg%3E"
            alt="Sunset over mountain views, painted in indigo"
            width="1600" height="900" />
          <figcaption class="carousel-caption">Mountain View</figcaption>
        </li>
        <li class="carousel-slide">
          <img
            src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%221600%22%20height%3D%22900%22%20viewBox%3D%220%200%201600%20900%22%3E%3Crect%20width%3D%221600%22%20height%3D%22900%22%20fill%3D%22%230ea5e9%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20font-family%3D%22system-ui%22%20font-weight%3D%22600%22%20font-size%3D%2272%22%20fill%3D%22%23ffffff%22%3ECity%20Skyline%3C%2Ftext%3E%3C%2Fsvg%3E"
            alt="City skyline at dusk, painted in sky blue"
            width="1600" height="900" />
          <figcaption class="carousel-caption">City Skyline</figcaption>
        </li>
        <li class="carousel-slide">
          <img
            src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%221600%22%20height%3D%22900%22%20viewBox%3D%220%200%201600%20900%22%3E%3Crect%20width%3D%221600%22%20height%3D%22900%22%20fill%3D%22%237c3aed%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20font-family%3D%22system-ui%22%20font-weight%3D%22600%22%20font-size%3D%2272%22%20fill%3D%22%23ffffff%22%3EAbstract%20Shape%3C%2Ftext%3E%3C%2Fsvg%3E"
            alt="Abstract shape in violet"
            width="1600" height="900" />
          <figcaption class="carousel-caption">Abstract Shape</figcaption>
        </li>
      </ul>

      <button class="carousel-btn carousel-prev" type="button" aria-label="Previous slide">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor"/></svg>
      </button>
      <button class="carousel-btn carousel-next" type="button" aria-label="Next slide">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8.59 7.41 10 6l6 6-6 6-1.41-1.41L13.17 12z" fill="currentColor"/></svg>
      </button>

      <div class="carousel-indicators" role="group" aria-label="Go to a slide"></div>
    </section>

    <div class="carousel-controls">
      <button class="autoplay-toggle" id="autoplay-toggle" type="button" aria-pressed="true">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>
        <span class="toggle-label">Pause</span>
      </button>
      <span class="autoplay-hint" role="status" aria-live="polite">Autoplay on</span>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
