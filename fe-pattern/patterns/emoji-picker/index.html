<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoji Picker — fe-pattern</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <h1 class="page-title">Emoji Picker</h1>
    <p class="page-sub">Open the picker, browse categories, and insert an emoji into the field.</p>

    <div class="field" id="field">
      <input type="text" id="input" class="field-input" placeholder="Type a message…" value="Love this " aria-label="Message" />
      <button type="button" id="toggle" class="toggle" aria-label="Open emoji picker" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-3.2 6.4a.9.9 0 0 1 1.3 0l1.3 1.4a.9.9 0 1 1-1.4 1.1l-1.2-1.3a.9.9 0 0 1 0-1.3Zm6.4 0a.9.9 0 0 1 0 1.3l-1.2 1.3a.9.9 0 1 1-1.4-1.1l1.3-1.4ZM8.5 12.6a.9.9 0 1 0 0 1.8h7a.9.9 0 0 0 0-1.8Z" />
        </svg>
      </button>
    </div>

    <div class="picker" id="picker" role="dialog" aria-label="Emoji picker" hidden>
      <div class="picker-grid" id="picker-grid" tabindex="0" role="grid"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
