<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gauge — demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="main" class="main">
    <h1>Gauge</h1>
    <p class="demo-sub">A semicircle SVG meter. Drag the slider to set the value; the needle sweeps
       and the arc fills from green to red as it approaches the max.</p>

    <section class="gauge-wrap">
      <svg class="gauge" id="gauge" viewBox="0 0 200 110" aria-hidden="true">
        <path class="gauge-track" d="M 20 100 A 80 80 0 0 1 180 100" fill="none"/>
        <path class="gauge-fill" id="gauge-fill" d="M 20 100 A 80 80 0 0 1 180 100" fill="none"/>
        <line class="gauge-needle" id="needle" x1="100" y1="100" x2="100" y2="20"/>
        <circle class="gauge-hub" cx="100" cy="100" r="6"/>
      </svg>
      <div class="gauge-value" id="value" aria-live="polite">0</div>
      <div class="gauge-label">Load</div>
    </section>

    <section class="control">
      <label class="label" for="slider">Value <span id="slider-val" class="val">0</span></label>
      <input type="range" id="slider" min="0" max="100" value="0" class="range" />
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
