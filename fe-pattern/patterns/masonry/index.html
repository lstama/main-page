<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masonry — demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="main" class="main">
    <h1>Masonry</h1>
    <p class="demo-sub">Variable-height cards flow into columns with CSS <span class="key">columns</span>.
       Collapses to a single column on narrow screens. No JS layout required.</p>

    <section class="masonry" id="masonry" aria-label="Masonry grid"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
