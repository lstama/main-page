<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modal Dialog — demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="demo">
    <h1>Modal dialog</h1>
    <p class="demo-sub">An accessible dialog: focus trapped, ESC to close, backdrop click to dismiss, focus restored on close.</p>
    <button class="demo-btn" id="open" type="button">Open modal</button>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc">
      <div class="modal-head">
        <h2 id="modalTitle">Delete item?</h2>
        <button class="modal-close" id="modalClose" type="button" aria-label="Close dialog">✕</button>
      </div>
      <p id="modalDesc">This action can't be undone. The item will be removed from your list permanently.</p>
      <div class="modal-foot">
        <button class="demo-btn ghost" id="cancel" type="button">Cancel</button>
        <button class="demo-btn danger" id="confirm" type="button">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
