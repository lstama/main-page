<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagination — demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="main" class="main">
    <h1>Pagination</h1>
    <p class="demo-sub">5 items per page. Click/tap a page number, or use the keyboard
       (Tab, ArrowLeft/Right, Home, End). Works on both desktop and mobile.</p>

    <ul class="grid" id="grid" aria-live="polite"></ul>

    <nav class="pager" id="pager" aria-label="Pagination">
      <button class="pager-btn nav" id="prev" type="button" aria-label="Previous page">← Prev</button>
      <ul class="page-list" id="page-list"></ul>
      <button class="pager-btn nav" id="next" type="button" aria-label="Next page">Next →</button>
    </nav>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
