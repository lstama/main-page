<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Popover — demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="main" class="main">
    <h1>Popover</h1>
    <p class="demo-sub">A floating panel anchored to a trigger. Opens on click and on
       <span class="key">Enter</span>/<span class="key">Space</span>; closes on
       <span class="key">Esc</span>, outside click, or the panel's own button. Focus stays trapped inside.</p>

    <section class="stage">
      <div class="anchor">
        <button type="button" class="trigger" id="trigger" aria-haspopup="dialog" aria-expanded="false">
          Open popover
        </button>
        <div class="popover" id="popover" role="dialog" aria-modal="true" aria-labelledby="pop-title">
          <h2 class="pop-title" id="pop-title">Choose an option</h2>
          <p class="pop-body">This popover is positioned dynamically so it never clips off-screen.</p>
          <div class="pop-actions">
            <button type="button" class="btn" id="pop-action">Confirm</button>
            <button type="button" class="btn ghost" id="pop-cancel">Cancel</button>
          </div>
        </div>
      </div>
    </section>

    <p class="note" id="note">Status: closed</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
