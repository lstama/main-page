<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress Stepper — demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="main" class="main">
    <h1>Progress stepper</h1>
    <p class="demo-sub">Shows where you are in a multi-step flow. On narrow screens it stacks
       vertically. Click a completed step to jump back.</p>

    <nav class="stepper" id="stepper" aria-label="Checkout progress">
      <ol class="stepper-list" id="stepper-list"></ol>
    </nav>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="controls">
      <label for="step-select">Change current step:</label>
      <select id="step-select">
        <option value="0" selected>Step 1 — Cart</option>
        <option value="1">Step 2 — Shipping</option>
        <option value="2">Step 3 — Payment</option>
        <option value="3">Step 4 — Confirmation</option>
      </select>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
