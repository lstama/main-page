<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rich Text Toolbar — fe-pattern</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <div class="editor-wrap">
      <header class="editor-head">
        <h1>Rich Text Toolbar</h1>
        <p class="editor-sub">Select some text to reveal the floating toolbar.</p>
      </header>
      <div class="editor" id="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Editor">
        <p>Highlight any word or phrase above to format it. The toolbar floats over your selection and applies changes with the browser's native editing commands.</p>
        <p>Try <strong>bold</strong>, <em>italic</em>, <u>underline</u>, lists, and links.</p>
      </div>
      <p class="editor-log" id="log" aria-live="polite"></p>
    </div>
    <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting" hidden>
      <button type="button" class="tb-btn" data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M6 5h7a3.5 3.5 0 0 1 1.5 6.5H6Zm0 8h8a3.5 3.5 0 0 1-1.5 6.5H6Z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <button type="button" class="tb-btn" data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><line x1="14" y1="4" x2="10" y2="20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="9" y1="4" x2="15" y2="4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="8" y1="20" x2="14" y2="20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="tb-btn" data-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 4v6a6 6 0 0 0 6 6v2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="18" y1="4" x2="18" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <span class="tb-sep"></span>
      <button type="button" class="tb-btn" data-cmd="insertUnorderedList" title="Bulleted list" aria-label="Bulleted list">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="4" cy="6" r="1.6" fill="currentColor"/><circle cx="4" cy="12" r="1.6" fill="currentColor"/><circle cx="4" cy="18" r="1.6" fill="currentColor"/><line x1="9" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="9" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="9" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="tb-btn" data-cmd="insertOrderedList" title="Numbered list" aria-label="Numbered list">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><text x="3" y="8" font-size="7" fill="currentColor" font-family="sans-serif">1</text><text x="3" y="14.5" font-size="7" fill="currentColor" font-family="sans-serif">2</text><text x="3" y="20.5" font-size="7" fill="currentColor" font-family="sans-serif">3</text><line x1="9" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="9" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="9" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <span class="tb-sep"></span>
      <button type="button" class="tb-btn" data-cmd="createLink" title="Add link" aria-label="Add link">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M10 14a3.5 3.5 0 0 0 5 0l4-4a3.5 3.5 0 0 0-5-5l-1.5 1.5M14 10a3.5 3.5 0 0 0-5 0l-4 4a3.5 3.5 0 0 0 5 5l1.5-1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
