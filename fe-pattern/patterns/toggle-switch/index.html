<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toggle Switch — demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="main" class="main">
    <h1>Toggle switch</h1>
    <p class="demo-sub">A native checkbox styled as a switch. Tap/click the thumb, or focus it
       and press <kbd>Space</kbd>. Keyboard and screen readers work with zero JS.</p>

    <label class="row">
      <span class="row-label">Wi-Fi</span>
      <input type="checkbox" class="switch-input" id="wifi" role="switch" checked />
      <span class="switch" aria-hidden="true"><span class="switch-thumb"></span></span>
    </label>

    <label class="row">
      <span class="row-label">Do Not Disturb</span>
      <input type="checkbox" class="switch-input" id="dnd" role="switch" />
      <span class="switch" aria-hidden="true"><span class="switch-thumb"></span></span>
    </label>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
