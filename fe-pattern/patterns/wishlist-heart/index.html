<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishlist Heart — fe-pattern</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <div class="card">
      <div class="card-media">
        <div class="media-grad"></div>
        <button class="heart" id="heart" role="button" aria-pressed="false" aria-label="Add to wishlist" title="Add to wishlist">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 20s-7-4.35-7-9.5A3.5 3.5 0 0 1 12 6a3.5 3.5 0 0 1 7 4.5C19 15.65 12 20 12 20Z"/>
          </svg>
          <span class="heart-fill" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28">
              <path fill="currentColor" d="M12 20s-7-4.35-7-9.5A3.5 3.5 0 0 1 12 6a3.5 3.5 0 0 1 7 4.5C19 15.65 12 20 12 20Z"/>
            </svg>
          </span>
        </button>
      </div>
      <div class="card-body">
        <h2 class="card-title">Aurora Headphones</h2>
        <p class="card-price">$249 <span class="card-old">$329</span></p>
        <p class="card-hint" id="hint">Tap the heart to add to your wishlist</p>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
